name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run test suite
        run: python3 -m unittest discover -s tests -v
        # Golden-output tests (tests/test_parser_golden.py) need a real save
        # fixture at tests/fixtures/sapphire.srm, which is gitignored and
        # never present in CI — they skip themselves automatically.
